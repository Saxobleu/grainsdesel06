<html lang="fr">
<head>
 <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
 <META NAME="Robots" CONTENT="none">
<TITLE>Grain de sel</TITLE>
<!-- <link rel="icon" href="http://gfait.free.fr/Grain/0utils/img/ICON-G.ico" type="image/x-icon">  --!>
	<link rel="stylesheet" href="mouv_style.css"/>


</head>

<body>

<section class="grain-animation">

  <div class="slide active">
    <svg viewBox="0 0 200 200" class="icon">
      <circle cx="100" cy="120" r="30" class="soil"/>
      <path d="M100 120 C100 80, 130 80, 130 50" class="stem"/>
      <circle cx="130" cy="40" r="10" class="leaf"/>
    </svg>
    <h1>Grain de Sel</h1>
    <p>Solidarité • Entraide • Écologie</p>
  </div>

  <div class="slide">
    <svg viewBox="0 0 200 200" class="icon">
      <circle cx="60" cy="100" r="20" class="node"/>
      <circle cx="140" cy="100" r="20" class="node"/>
      <path d="M80 100 Q100 60 120 100" class="flow"/>
      <path d="M120 100 Q100 140 80 100" class="flow"/>
    </svg>
    <h2>Don libre</h2>
    <p>Sans échange direct</p>
  </div>

  <div class="slide">
    <svg viewBox="0 0 200 200" class="icon">
      <circle cx="70" cy="100" r="20" class="person"/>
      <circle cx="130" cy="100" r="20" class="person"/>
      <path d="M70 120 Q100 150 130 120" class="hands"/>
    </svg>
    <h2>Communauté</h2>
    <p>Chacun donne quand il peut</p>
  </div>

  <div class="slide">
    <svg viewBox="0 0 200 200" class="icon">
      <circle cx="100" cy="100" r="50" class="pulse"/>
    </svg>
    <h2>Rejoignez-nous</h2>
    <p>WhatsApp : GRAINS DE SEL 06</p>
  </div>

</section>

<!--	<script type='text/javascript' src='mouv_style.js'></script>  --!>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const slides = document.querySelectorAll(".slide");
  let index = 0;

  function nextSlide() {
    slides[index].classList.remove("active");
    index = (index + 1) % slides.length;
    slides[index].classList.add("active");
  }

  setInterval(nextSlide, 6000);
});
</script>

</body>
</html>
